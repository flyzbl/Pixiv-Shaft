name: Materialize novel translation fork

on:
  push:
    branches: [classic]
    paths:
      - 'tools/materialize_novel_translation_fork.py'
      - '.github/workflows/materialize-novel-fork.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g'

jobs:
  materialize-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Validate and materialize source
        run: |
          python3 -m py_compile tools/materialize_novel_translation_fork.py
          python3 tools/materialize_novel_translation_fork.py
          git diff --check
          git status --short

      - name: Commit materialized source back to classic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(novel): whole-novel translation in V3 reader'
          git push origin HEAD:classic

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build GitHub debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shaft-novel-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
